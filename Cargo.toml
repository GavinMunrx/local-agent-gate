[workspace]
resolver = "2"
members = [
    "crates/agent-gate-policy",
    "crates/agent-gate-daemon",
    "crates/agent-gate-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml_edit = "0.22"
tokio-stream = { version = "0.1", features = ["sync"] }
tempfile = "3"
clap = { version = "4", features = ["derive"] }
axum = "0.7"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tower = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
shell-words = "1"
regex = "1"

agent-gate-policy = { path = "crates/agent-gate-policy" }
agent-gate-daemon = { path = "crates/agent-gate-daemon" }
