# Policy for developing Local Agent Gate itself.
#
# This repo's build/test loop is mostly commands with no specific risk rule
# (cargo build, swift build, launchctl), which land in the medium "unknown"
# bucket. Gating those means the tool interrupts its own development, so medium
# is allowed here. Tighten this to `ask` with explicit allow rules if you want
# to exercise the approval flow while working in this repo.
#
# High risk still asks, and the built-in catastrophic tier still denies
# unconditionally - no rule in this file can override that.
version: 1
defaults:
  lowRisk: allow
  mediumRisk: allow
  highRisk: ask
rules:
  - id: ask-release-publish
    match:
      commandRegex: "(cargo publish|npm publish)"
    decision: ask
